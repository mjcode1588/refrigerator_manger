<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리집 식재료·보관품 관리 (기능 실험 프로토타입)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>" />
  <link rel="stylesheet" href="/web/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-icon">🧊</span>
        <div>
          <h1>우리집 식재료 관리</h1>
          <p class="subtitle">Phase 3 기능 실험용 웹 프로토타입 · <span id="dbStatus">연결 확인 중...</span></p>
        </div>
      </div>
      <div id="userArea" class="user-area"></div>
    </div>
  </header>

  <main class="container">
    <!-- 로그인 패널 -->
    <section id="authSection" class="card auth-card">
      <h2>👋 로컬 개발 로그인 (가족 계정 실험)</h2>
      <p class="muted">소셜 로그인 연동 전, 가족 구성원 닉네임으로 빠르게 로그인해 공동 관리·초대·이력 기능을 실험할 수 있습니다.</p>
      <form id="loginForm" class="row-form">
        <input id="loginNickname" type="text" placeholder="닉네임 (예: 민수, 지영)" required />
        <input id="loginEmail" type="email" placeholder="이메일 (선택)" />
        <button type="submit" class="btn primary">로그인 / 시작하기</button>
      </form>
      <div class="quick-users">
        <span class="muted">빠른 전환:</span>
        <button type="button" class="btn ghost quick-login-btn" data-name="민수">민수</button>
        <button type="button" class="btn ghost quick-login-btn" data-name="지영">지영</button>
      </div>
    </section>

    <!-- 메인 워크스페이스 -->
    <div id="appWorkspace" class="hidden">
      <!-- 가구 선택 및 초대 바 -->
      <section class="card household-bar">
        <div class="household-select-wrap">
          <label for="householdSelect">현재 가구</label>
          <select id="householdSelect"></select>
          <button id="createHouseholdBtn" type="button" class="btn secondary">+ 새 우리집</button>
          <button id="joinHouseholdBtn" type="button" class="btn ghost">초대 코드 참여</button>
        </div>
        <div class="household-actions">
          <button id="createInviteBtn" type="button" class="btn primary">초대 코드 발급</button>
          <span id="inviteResult" class="invite-badge hidden"></span>
        </div>
      </section>

      <!-- 요약 통계 -->
      <section class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">보관 중</span>
          <strong id="statActive" class="stat-value">0</strong>
        </div>
        <div class="stat-card warn">
          <span class="stat-label">임박 (D-3 이내)</span>
          <strong id="statExpiring" class="stat-value">0</strong>
        </div>
        <div class="stat-card danger">
          <span class="stat-label">만료됨</span>
          <strong id="statExpired" class="stat-value">0</strong>
        </div>
      </section>

      <div class="main-grid">
        <!-- 좌측: 자유 트리 보관 장소 -->
        <aside class="card tree-panel">
          <div class="panel-header">
            <h2>📂 보관 장소 (자유 트리)</h2>
            <button id="addRootLocationBtn" type="button" class="btn small primary">+ 최상위 장소</button>
          </div>
          <button id="selectAllLocationsBtn" type="button" class="tree-all-btn active">
            🏠 전체 보관 장소 보기
          </button>
          <div id="locationTree" class="location-tree"></div>
        </aside>

        <!-- 우측: 품목 관리 & 이력 -->
        <section class="content-panel">
          <!-- 품목 등록 폼 -->
          <div class="card">
            <div class="panel-header">
              <h2>🥬 품목 등록</h2>
            </div>
            <form id="createItemForm" class="item-form">
              <select id="itemLocationSelect" required></select>
              <input id="itemName" type="text" placeholder="품목명 (예: 서울우유 1L, 신라면)" required />
              <select id="itemCategory">
                <option value="FRESH">신선식품</option>
                <option value="MEAT_FISH">육류/수산</option>
                <option value="DAIRY">유제품</option>
                <option value="PROCESSED">가공/완제품</option>
                <option value="BEVERAGE">음료</option>
                <option value="SAUCE">양념/소스</option>
                <option value="ETC" selected>기타</option>
              </select>
              <input id="itemQty" type="number" step="0.1" min="0.1" value="1" required />
              <input id="itemUnit" type="text" value="개" placeholder="단위" required />
              <input id="itemExpiry" type="date" />
              <select id="itemExpiryType">
                <option value="USE_BY">소비기한</option>
                <option value="BEST_BEFORE">유통기한</option>
                <option value="NONE">기한 없음</option>
              </select>
              <input id="itemMemo" type="text" placeholder="메모 (선택)" />
              <button type="submit" class="btn primary">등록</button>
            </form>
          </div>

          <!-- 품목 목록 -->
          <div class="card">
            <div class="panel-header">
              <h2>📦 재고 목록 <span id="currentLocationLabel" class="muted"></span></h2>
              <div class="filter-controls">
                <input id="searchInput" type="search" placeholder="품목명/메모 검색..." />
                <select id="statusFilter">
                  <option value="ACTIVE">보관 중</option>
                  <option value="CONSUMED">소비 완료</option>
                  <option value="DISCARDED">폐기</option>
                </select>
              </div>
            </div>
            <div id="itemsList" class="items-list"></div>
          </div>

          <!-- 가족 변경 이력 -->
          <div class="card">
            <div class="panel-header">
              <h2>🕒 가족 변경 이력</h2>
              <button id="refreshActivitiesBtn" type="button" class="btn small ghost">새로고침</button>
            </div>
            <ul id="activitiesList" class="activities-list"></ul>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/web/app.js"></script>
</body>
</html>
